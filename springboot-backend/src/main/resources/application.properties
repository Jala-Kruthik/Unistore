spring.application.name=unistore-backend

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/unistore
spring.data.mongodb.database=unistore

# Server Configuration
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
